name: Mirror legacy image tags

# Republishes tags that were pushed before this repository was renamed under
# the current package name, manifest for manifest, so a consumer can move to
# the new name without waiting for a rebuild and without a digest change.
# Delete this workflow once no consumer resolves the pre-rename package.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags to copy from the pre-rename package"
        required: true
        default: "1.0.0-rc.1 latest"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/qvest-digital/dmf-mf-mxl-writer
  LEGACY_IMAGE: ghcr.io/qvest-digital/mxl-dmf-writer

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy tags
        shell: bash
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "== $LEGACY_IMAGE:$tag -> $IMAGE:$tag"
            docker buildx imagetools create --tag "$IMAGE:$tag" "$LEGACY_IMAGE:$tag"
            docker buildx imagetools inspect "$IMAGE:$tag" --format '{{ .Manifest.Digest }}'
          done
